name: Feature request
description: Propose a capability or a change in behaviour
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        This project is spec-driven. A non-trivial feature becomes a change proposal under
        `openspec/changes/` before code is written. See
        [AGENTS.md section 8](../blob/main/AGENTS.md#8-openspec-workflow).

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible today? Describe the situation, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: What should ORBIT do instead? Concrete commands and output if you can.
    validations:
      required: true

  - type: dropdown
    id: capability
    attributes:
      label: Which capability does this touch?
      options:
        - cli-create
        - cli-list
        - cli-doctor
        - framework-catalog
        - project-validation
        - command-execution
        - new capability
        - not sure
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
